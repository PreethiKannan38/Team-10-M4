name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        # Since the code lives inside the "frontend" folder in this repo,
        # all steps will automatically cd into "frontend" before running.
        working-directory: ./frontend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install Dependencies
      run: npm install
      
    - name: Run Linter
      run: npm run lint
      
    - name: Verify Build
      run: npm run build
